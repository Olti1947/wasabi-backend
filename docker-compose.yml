name: "wasabi-backend"
services:
  database:
    image: postgres:16.3
    hostname: postgres
    container_name: wasabi-database
    ports:
      - "5431:5432"
    environment:
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=wasabi
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    restart: unless-stopped