name: "wasabi-backend"
services:
  database:
    image: postgres:16.3
    hostname: postgres
    container_name: wasabi-database
    ports:
      - "5431:5432"
    environment:
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=wasabi
    volumes:
      - wasabi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wasabi"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  wasabi-db-data:
