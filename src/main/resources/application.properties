spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5431/wasabi}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

spring.application.name=wasabi-backend

# Image uploads only work with real Cloudinary credentials; the app still starts without them.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

jwt.secretKey = ${JWT_SECRET}

# Push notifications are disabled if this file does not exist.
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:src/main/resources/firebase-service-account/sushi-wasabi-service-account.json}

# Default admin, created on startup only if no ADMIN user exists yet. Skipped when the password is empty.
admin.email=${ADMIN_EMAIL:admin@wasabi.local}
admin.password=${ADMIN_PASSWORD:}

# Demo menu, banners, discounts, customer and orders for local development (see db/demo/demo-data.sql).
demo-data.enabled=${SEED_DEMO_DATA:false}
